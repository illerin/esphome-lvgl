# =============================================================================
# HOME ASSISTANT -> SCREEN SYNC (stage 1)
# Reads sensor.family_todo attributes (t1..t8 / p1..p8 / id1..id8) and the
# state of the two lights.
# =============================================================================

sensor:
  # number of open tasks -> "To-do (N)" header
  - platform: homeassistant
    entity_id: ${todo_entity}
    id: todo_count
    internal: true
    on_value:
      - lvgl.label.update:
          id: todo_title
          text:
            format: "To-do (%d)"
            args: [ '(int) x' ]

  # ---- row 1: Vikunja task id (used when you tap the box)
  - platform: homeassistant
    entity_id: ${todo_entity}
    attribute: id1
    id: todo_id_1
    internal: true

  # ---- row 1: priority -> stripe colour
  - platform: homeassistant
    entity_id: ${todo_entity}
    attribute: p1
    id: todo_prio_1
    internal: true
    on_value:
      - lvgl.widget.update:
          id: todo_stripe_1
          bg_color: !lambda |-
            int p = (int) x;
            if (p >= 4) return lv_color_hex(0xE53935);
            if (p == 3) return lv_color_hex(0xFB8C00);
            if (p == 2) return lv_color_hex(0xFDD835);
            if (p == 1) return lv_color_hex(0x43A047);
            return lv_color_hex(0x555555);

  # ---- row 2: Vikunja task id (used when you tap the box)
  - platform: homeassistant
    entity_id: ${todo_entity}
    attribute: id2
    id: todo_id_2
    internal: true

  # ---- row 2: priority -> stripe colour
  - platform: homeassistant
    entity_id: ${todo_entity}
    attribute: p2
    id: todo_prio_2
