text_sensor:

  # ---- weather: condition (the state of sensor.display_weather)
  - platform: homeassistant
    entity_id: ${weather_entity}
    id: weather_state
    internal: true
    on_value:
      - lvgl.label.update:
          id: weather_cond
          text: !lambda |-
            if (x == "sunny") return "Sunny";
            if (x == "clear-night") return "Clear";
            if (x == "partlycloudy") return "Partly cloudy";
            if (x == "cloudy") return "Cloudy";
            if (x == "rainy") return "Rainy";
            if (x == "pouring") return "Heavy rain";
            if (x == "snowy") return "Snow";
            if (x == "snowy-rainy") return "Sleet";
            if (x == "fog") return "Fog";
            if (x == "windy" || x == "windy-variant") return "Windy";
            if (x == "lightning" || x == "lightning-rainy") return "Storms";
            if (x == "hail") return "Hail";
            return x.c_str();

  # ---- weather: current temperature
  - platform: homeassistant
    entity_id: ${weather_entity}
    attribute: temp
    id: weather_temp_now
    internal: true
    on_value:
      - lvgl.label.update:
          id: weather_temp
          text:
            format: "%s°"
            args: [ 'x.c_str()' ]

  # ---- weather: today high / low
  - platform: homeassistant
    entity_id: ${weather_entity}
    attribute: hi
    id: weather_hi
    internal: true
    on_value:
      - lvgl.label.update:
          id: weather_hilo
          text:
            format: "H %s°  L %s°"
            args: [ 'x.c_str()', 'id(weather_lo).state.c_str()' ]

  - platform: homeassistant
    entity_id: ${weather_entity}
    attribute: lo
    id: weather_lo
    internal: true
    on_value:
      - lvgl.label.update:
          id: weather_hilo
          text:
            format: "H %s°  L %s°"
            args: [ 'id(weather_hi).state.c_str()', 'x.c_str()' ]

  # ---- row 1: title (empty title hides the row)
  - platform: homeassistant
    entity_id: ${todo_entity}
    attribute: t1
    id: todo_title_1
    internal: true
    on_value:
      - lvgl.label.update:
          id: todo_text_1
          text: !lambda 'return x.c_str();'
      - if:
          condition:
            lambda: 'return x.empty();'
          then:
            - lvgl.widget.hide: todo_row_1
          else:
            - lvgl.widget.show: todo_row_1

  # ---- row 2: title (empty title hides the row)
