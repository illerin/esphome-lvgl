binary_sensor:
  - platform: homeassistant
    id: light1_state
    entity_id: ${light1_entity}
    internal: true
    trigger_on_initial_state: true
    on_state:
      then:
        lvgl.widget.update:
          id: light1_button
          state:
            checked: !lambda return x;

  - platform: homeassistant
    id: light2_state
    entity_id: ${light2_entity}
    internal: true
    trigger_on_initial_state: true
    on_state:
      then:
        lvgl.widget.update:
          id: light2_button
          state:
            checked: !lambda return x;
