# =============================================================================
# HOME DISPLAY - LVGL LAYOUT (stage 1)
# Left column : weather tile (placeholder), calendar tile (placeholder), 2 light buttons
# Right column: to-do list (8 rows, priority stripe, tap the box to complete)
#
# light1_entity / light2_entity can be ANY toggleable entity (light, switch, fan, input_boolean).
# Override these in your ESPHome stub (esphome-screen.yaml) under `substitutions:`
# =============================================================================
substitutions:
  light1_entity: light.CHANGE_ME_1
  light1_name: "Light 1"
  light2_entity: light.CHANGE_ME_2
  light2_name: "Light 2"
  todo_entity: sensor.family_todo
  weather_entity: sensor.display_weather
  todo_complete_script: script.vikunja_complete_task

lvgl:
  buffer_size: 100%
  top_layer:
    widgets:
      # Clock - the time addon updates this label by id, keep the id
      - label:
          text: "--:--"
          id: display_time
          styles: roboto15_style
          align: top_mid
          x: 0
          y: 4
          text_align: center
          text_color: 0xFFFFFF

  pages:
    - id: main_page
      scrollable: false
      bg_color: 0x000000
      bg_opa: COVER
      widgets:

        # ---------------- WEATHER TILE ----------------
        - obj:
            id: weather_tile
            x: 5
            y: 36
            width: 232
            height: 104
            bg_color: 0x1C1C1C
            border_width: 0
            radius: 12
            pad_all: 0
            scrollable: false
            widgets:
              - label:
                  id: weather_temp
                  text: "--°"
                  text_font: roboto48_font
                  text_color: 0xFFFFFF
                  align: top_left
                  x: 12
                  y: 6
              - label:
                  id: weather_cond
                  text: "--"
                  text_font: roboto19_font
                  text_color: 0x8EC5FF
                  text_align: right
                  align: top_right
                  x: -12
                  y: 14
                  width: 110
                  height: 26
                  long_mode: DOT
              - label:
                  id: weather_hilo
                  text: "H -°  L -°"
                  text_font: roboto19_font
                  text_color: 0xC8C8C8
                  align: bottom_left
                  x: 12
                  y: -8

        # ---------------- CALENDAR TILE (placeholder) ----------------
        - obj:
            id: calendar_tile
            x: 5
            y: 146
            width: 232
            height: 206
            bg_color: 0x1C1C1C
            border_width: 0
            radius: 12
            pad_all: 0
            scrollable: false
            widgets:
              - label:
                  text: "Today"
                  text_font: roboto19_font
                  text_color: 0xFFFFFF
                  align: top_left
                  x: 12
                  y: 8
              - label:
                  text: "coming next"
                  text_font: roboto17_font
                  text_color: 0x808080
                  align: bottom_left
                  x: 12
                  y: -8

        # ---------------- LIGHT BUTTONS ----------------
        - button:
            id: light1_button
            x: 5
            y: 358
            width: 112
            height: 112
            checkable: true
            styles: control
            widgets:
              - label:
                  text: "${light1_name}"
                  text_font: roboto19_font
                  align: center
            on_press:
              - homeassistant.action:
                  action: homeassistant.toggle
                  data:
                    entity_id: ${light1_entity}

        - button:
            id: light2_button
            x: 125
            y: 358
            width: 112
            height: 112
            checkable: true
            styles: control
            widgets:
              - label:
                  text: "${light2_name}"
                  text_font: roboto19_font
                  align: center
            on_press:
              - homeassistant.action:
                  action: homeassistant.toggle
                  data:
                    entity_id: ${light2_entity}

        # ---------------- TO-DO PANEL ----------------
        - obj:
            id: todo_panel
            x: 243
            y: 36
            width: 232
            height: 434
            bg_color: 0x1C1C1C
            border_width: 0
            radius: 12
            pad_all: 0
            scrollable: false
            widgets:
              - label:
                  id: todo_title
                  text: "To-do"
                  text_font: roboto19_font
                  text_color: 0xFFFFFF
                  align: top_left
                  x: 12
                  y: 8
              - obj:
                  id: todo_row_1
                  x: 0
                  y: 38
                  width: 232
                  height: 46
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  hidden: true
                  widgets:
                    - obj:
                        id: todo_stripe_1
                        x: 6
                        y: 8
                        width: 4
                        height: 30
                        radius: 2
                        border_width: 0
                        bg_color: 0x555555
                        bg_opa: COVER
                        clickable: false
                    - button:
                        id: todo_check_1
                        x: 16
                        y: 3
                        width: 40
                        height: 40
                        radius: 8
                        bg_opa: TRANSP
                        border_width: 2
                        border_color: 0x8A8A8A
                        shadow_width: 0
                        on_click:
                          - if:
                              condition:
                                lambda: 'return id(todo_id_1).has_state() && id(todo_id_1).state > 0;'
                              then:
                                - homeassistant.action:
                                    action: ${todo_complete_script}
                                    data:
                                      task_id: !lambda 'return to_string((int) id(todo_id_1).state);'
                    - label:
                        id: todo_text_1
                        x: 64
                        y: 3
                        width: 162
                        height: 40
                        long_mode: DOT
                        text: ""
                        text_font: roboto17_font
                        text_color: 0xFFFFFF
              - obj:
